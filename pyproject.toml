[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faculty-workload-assistant"
version = "1.0.0"
description = "Production-oriented terminal assistant for university faculty workload intelligence, policy validation, timetable analysis, and compliance."
authors = [{ name = "Senior AI/ML Architecture Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --ignore=app/evaluation/test_runner.py"

